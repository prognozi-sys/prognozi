<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProGnozi — ფეხბურთის პროგნოზები</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1613;--s1:#16201c;--s2:#1c2823;--s3:#23312b;--line:#2a3832;--text:#ecf1ee;--muted:#97a69e;--dim:#66766e;
--amb:#f2b441;--h:#5b9bf0;--d:#8c9993;--a:#eb8a3c;--good:#3cc27a;--bad:#ef6464;--geo:#e8263b;--acc2:#7fb2f5;
--num:"Barlow Condensed","Arial Narrow",sans-serif;color-scheme:dark}
body.light{--bg:#eef2ef;--s1:#ffffff;--s2:#f5f8f6;--s3:#e8eeea;--line:#d6dfd9;--text:#13201a;--muted:#55665e;--dim:#879690;
--amb:#9a6500;--h:#2f74d0;--d:#7b8983;--a:#cc6214;--good:#16834a;--bad:#c62f2f;--acc2:#2f74d0;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 "Noto Sans Georgian",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body.en .ka,body:not(.en) .en{display:none}
a{color:var(--acc2)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--text)}
.logo svg{flex:none}
.upd{color:var(--muted);font-size:12px}
.sp{flex:1}
.btn{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;min-width:38px}
.btn:hover{border-color:var(--muted)}
nav{display:flex;gap:4px}
nav a{display:flex;align-items:center;gap:7px;padding:10px 12px 11px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:600;font-size:14px;border-bottom:2px solid transparent}
nav a:hover{color:var(--text)} nav a.on{color:var(--text);border-color:var(--amb)}
nav a .ic{font-size:16px;line-height:1}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:20px;background:var(--s3);color:var(--muted);font-family:var(--num);letter-spacing:.3px}
main{padding:18px 0 40px}
section{display:none}section.on{display:block}
h2{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.2px}
h3{font-size:16px;font-weight:700;margin:26px 0 10px}
h4{font-size:14px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:70ch}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.note{font-size:13.5px;color:var(--muted);line-height:1.65}
.box{padding:14px 16px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* filters */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.chips button{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* team badge */
.tb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:10px;font-weight:800;color:#fff;flex:none;font-family:var(--num);letter-spacing:.4px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.tb.lg{width:40px;height:40px;font-size:14px}
/* day */
.day{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;font-weight:700;font-size:14.5px}
.day span{color:var(--muted);font-weight:500;font-size:13px}
/* match card: scoreboard */
.ml{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.m+.m{border-top:1px solid var(--line)}
.mh{display:grid;grid-template-columns:58px 1fr 210px 18px;gap:14px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer}
.mh:hover{background:var(--s2)}
.mt{font-family:var(--num);font-size:20px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.mt small{display:block;white-space:nowrap;font-family:"Noto Sans Georgian",sans-serif;font-size:11px;color:var(--muted);font-weight:500;margin-top:5px;line-height:1.25}
.sb{min-width:0}
.tr{display:flex;align-items:center;gap:9px;height:30px}
.tr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--muted)}
.tr em{font-style:normal;font-family:var(--num);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);min-width:46px;text-align:right}
.tr.fav .n{color:var(--text)} .tr.fav em{color:var(--text);font-weight:700}
.dr{display:flex;align-items:center;gap:8px;margin:5px 0 0}
.pb{flex:1;display:flex;height:6px;gap:2px}
.pb i{display:block;min-width:3px}
.pb .h{background:var(--h);border-radius:3px 0 0 3px}.pb .d{background:var(--d)}.pb .a{background:var(--a);border-radius:0 3px 3px 0}
.dr span{font-size:12px;color:var(--muted);white-space:nowrap}
.dr b{font-family:var(--num);font-size:15px;font-weight:600;color:var(--text)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fact{background:var(--s2);border-radius:8px;padding:5px 9px;font-size:11.5px;color:var(--muted);line-height:1.3}
.fact b{display:block;font-family:var(--num);font-size:18px;font-weight:600;color:var(--text);line-height:1.1}
.fact:last-child:nth-child(odd){grid-column:span 2}
.mh:hover .fact,.m.open .fact{background:var(--s3)}
.fact.v{background:color-mix(in srgb,var(--amb) 16%,transparent);color:var(--amb)}
.fact.v b{color:var(--amb)}
.chev{color:var(--dim);transition:transform .2s;font-size:20px;text-align:center}
.m.open .chev{transform:rotate(90deg)}

/* detail panel */
.det{display:none;padding:0 14px 16px;border-top:1px dashed var(--line);background:var(--s2)}
.m.open .det{display:block}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 12px;padding:0 10px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px 9px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--amb)}
.pane{display:none}.pane.on{display:block}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.kv div{background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:12px;color:var(--muted)}
.kv b{display:block;color:var(--text);font-family:var(--num);font-size:19px;font-weight:600;line-height:1.15}
.why{margin:0;padding:0;list-style:none}
.why li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;max-width:75ch}
.why li:last-child{border-bottom:0}
.fc{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:5px;font-size:10.5px;font-weight:800;margin-right:3px;color:#fff;font-style:normal}
.fc.W{background:#24a35a}.fc.D{background:#6b7685}.fc.L{background:#d84a45}
.mini{font-size:13.5px}.mini h4{margin:4px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.mini ul{margin:0;padding-left:18px}.mini li{margin:2px 0}
.refb{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:13.5px}
.det .card.box{background:var(--s1);margin-top:10px;font-size:13.5px}
details.how{margin-top:8px;font-size:12.5px;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;display:inline-flex;align-items:center;gap:5px}
details.how summary::-webkit-details-marker{display:none}
details.how summary:before{content:"ⓘ";font-size:13px}
details.how[open] summary{color:var(--text)}
details.how>div{margin-top:6px;line-height:1.6;max-width:80ch}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--s3);color:var(--muted);margin-right:5px}
.tag.g{background:color-mix(in srgb,var(--amb) 18%,transparent);color:var(--amb)}
.tag.geo{background:color-mix(in srgb,var(--geo) 20%,transparent);color:#ff6b7a}
/* georgia hero */
.hero{border-radius:14px;padding:16px 18px;border:1px solid color-mix(in srgb,var(--geo) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--geo) 12%,var(--s1)),var(--s1) 70%);margin-bottom:6px}
.hero .hd{display:flex;align-items:center;gap:10px;font-weight:700}
.hero .hd span{color:var(--muted);font-weight:500;font-size:13px}
.flag{width:27px;height:18px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0 10px;text-align:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.vs .t em{font-style:normal;font-family:var(--num);font-size:40px;font-weight:700;line-height:1}
.vs .c{color:var(--muted);font-size:12px}
.vs .c em{display:block;font-style:normal;font-family:var(--num);font-size:24px;color:var(--text);font-weight:600}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.cb{position:relative;min-width:80px}.cb i{position:absolute;right:6px;top:8px;bottom:8px;border-radius:3px;background:var(--h);opacity:.3}.cb span{position:relative}
.geoRow td{background:color-mix(in srgb,var(--geo) 11%,transparent)}
.place{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;min-width:110px}
.place i{display:block}
.tm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tiles */
.tile{padding:13px 14px}.tile .l{font-size:12.5px;color:var(--muted)}.tile .v{font-family:var(--num);font-size:32px;font-weight:700;line-height:1.1;margin:3px 0;font-variant-numeric:tabular-nums}.tile .s{font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin:0 0 12px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--s3);color:var(--text)}
.pl{color:inherit;text-decoration:underline dotted color-mix(in srgb,var(--muted) 70%,transparent);text-underline-offset:3px;cursor:pointer}
.pl:hover{color:var(--amb)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:36px 12px;overflow:auto}
.ovl.on{display:flex}.ovb{max-width:580px;width:100%;padding:18px 18px 14px;position:relative}
.ovx{position:absolute;top:10px;right:10px;background:var(--s3);color:var(--text);border:0;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.plh{display:flex;gap:12px;align-items:center;margin-bottom:12px;padding-right:40px}.plh h3{margin:0;font-size:20px}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pst div{background:var(--s2);border-radius:9px;padding:8px 10px}
.pst b{display:block;font-family:var(--num);font-size:24px;line-height:1.1}.pst span{font-size:12px;color:var(--muted)}
.rsc{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--good),var(--amb),var(--bad));margin:10px 0 4px;max-width:340px}
.rsc b{position:absolute;top:-5px;width:4px;height:16px;margin-left:-2px;background:var(--text);border-radius:2px}
.rsc i{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;background:var(--bg);opacity:.8}
.gp{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;margin-bottom:8px;align-items:center}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.honest{border-left:3px solid var(--amb);padding:12px 14px;background:var(--s1);border-radius:0 10px 10px 0;margin-top:14px}
.pr{display:grid;grid-template-columns:1.3fr 1fr auto;gap:12px;align-items:center;padding:11px 14px;font-size:14px}
.pr+.pr{border-top:1px solid var(--line)}
.po{text-align:right;line-height:1.15}.po b{display:block;font-family:var(--num);font-size:24px;font-weight:700}.po span{font-size:13px;font-weight:600}
@media(max-width:760px){.pr{grid-template-columns:1fr auto;}.pr>div:nth-child(2){grid-column:1;grid-row:2}.pr .po{grid-row:1/3;grid-column:2}}
/* live */
.lvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--bad);box-shadow:0 0 0 0 var(--bad);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lc{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lc.on{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.lt{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.lt .lg{grid-column:2}
.min{font-family:var(--num);font-size:22px;font-weight:700;color:var(--bad);min-width:44px;grid-row:1/3}
.min.fin{color:var(--muted);font-size:17px}.min.pre{color:var(--text);font-weight:600}
.lteams{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.lteams span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lsc{font-family:var(--num);font-size:24px;font-weight:700;white-space:nowrap}
.lfl{margin:8px 0 0}
.lst{margin-top:12px}
.lh{font-size:13.5px}.lh .big{font-family:var(--num);font-size:20px}
.vd{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--s3);color:var(--muted)}
.vd.lo{background:color-mix(in srgb,var(--h) 20%,transparent);color:var(--acc2)}.vd.hi{background:color-mix(in srgb,var(--a) 22%,transparent);color:var(--a)}
.trk{position:relative;height:10px;border-radius:5px;background:var(--s3);margin:7px 0 5px}
.trk i{position:absolute;top:0;bottom:0;display:block}
.trk .nw,.lleg .nw{background:var(--amb);border-radius:5px 0 0 5px}
.trk.k .nw{background:var(--h)}
.trk .rm,.lleg .rm{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--amb) 55%,transparent) 0 3px,transparent 3px 6px)}
.trk.k .rm{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--h) 55%,transparent) 0 3px,transparent 3px 6px)}
.trk .ex{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.lns{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.lns span{background:var(--s2);border-radius:7px;padding:3px 8px;font-size:12px;color:var(--muted)}
.lns b{color:var(--text)}.lns em{font-style:normal;font-family:var(--num);font-size:14px;color:var(--amb);margin-left:3px}
.lex{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px;color:var(--muted)}.lex b{color:var(--text)}
.lpre{display:flex;gap:6px;margin-top:10px}.lpre .fact{flex:1}
.tl{position:relative;height:26px;margin:12px 0 0;border-bottom:2px solid var(--line)}
.tl .ht{position:absolute;left:47.4%;top:4px;bottom:-2px;width:1px;background:var(--dim)}
.ev{position:absolute;transform:translateX(-50%);font-size:13px;line-height:1}
.ev.h{top:0}.ev.a{top:12px}
.lleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:12px 0 0}
.lleg i{display:inline-block;width:16px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;position:static}
.lleg .ex{width:2px;background:var(--text)}
@media(max-width:760px){.lgrid{grid-template-columns:1fr}}
/* highlights */
.hls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.hl{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--line)}
.hl.k-c,.hl.k-p{border-top-color:var(--amb)}.hl.k-k{border-top-color:var(--h)}.hl.k-g{border-top-color:var(--good)}.hl.k-v{border-top-color:#9b7bff}
.hlt{font-size:13px;font-weight:700;color:var(--muted)}
.hlm{font-weight:700;display:flex;flex-direction:column;line-height:1.35}
.hlw{font-size:15px;font-weight:700}
.hlb{display:flex;align-items:baseline;gap:8px}.hlb b{font-family:var(--num);font-size:38px;font-weight:700;line-height:1}.hlb span{color:var(--muted);font-size:13px}
.hlr{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.hl ul{margin:0;padding-left:17px;font-size:13.5px;line-height:1.5}.hl li{margin:2px 0}
.hls-src{float:right;font-weight:500;font-size:11.5px;color:var(--dim)}
.hlo{font-size:12.5px;background:var(--s2);border-radius:8px;padding:6px 9px;color:var(--muted)}
.hlgo{margin-top:auto;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);text-decoration:none}
.hlgo:hover{border-color:var(--muted)}
@media(max-width:760px){.hls{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:84%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.hl{scroll-snap-align:start}}
.mvc{font-size:12px;margin-top:5px;color:var(--muted)}.mvc b{font-family:var(--num);font-size:14px;color:var(--text)}
.mvc.dn b{color:var(--good)}.mvc.up b{color:var(--bad)}
.mdn{color:var(--good);font-size:11px}.mup{color:var(--bad);font-size:11px}
.mvb{margin:0 0 12px}.mvb td,.mvb th{white-space:nowrap;padding-left:6px;padding-right:6px}.mvb td:first-child{white-space:normal}.mvb table{margin-top:6px}.mvb th{font-weight:600}
.hl.k-m{border-top-color:var(--good)}.hl.k-f{border-top-color:#9b7bff}.hl.k-u{border-top-color:var(--d)}.hl.k-m .hlb b{font-size:28px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:18px 0 30px}
.astro{margin-top:14px;padding:12px;border-radius:12px;border:1px solid rgba(160,120,255,.35);background:linear-gradient(135deg,rgba(120,80,220,.12),rgba(40,20,90,.06))}
.astro .ah{font-weight:700;margin-bottom:8px}
.sgb{display:flex;gap:3px;align-items:flex-end;margin:8px 0;height:52px}

.sgb i{display:block;width:70%;background:#9b7bff;border-radius:3px 3px 0 0}
.sgb em{font-style:normal;opacity:.6;font-size:10px;height:12px}
.mrow{display:grid;grid-template-columns:58px 1fr 210px 1fr 18px;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}

 .wrap{padding:0 12px}

 .mt{font-size:18px}
 .tr em{font-size:22px}
 .g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
 th,td{padding:7px 6px}
 .vs .t em{font-size:34px}

"ka": "საუკეთესო კოეფ. ≥ Pinnacle +2%, კოეფ. ≤2.5", "en": "Best price ≥ Pinnacle +2%, odds ≤2.5", "n": 113, "roi": 0.134, "lo": -0.045, "hi": 0.314}], "conclusions": {"ka": ["არცერთი სტატისტიკური მოდელი ბუკმეიკერზე ზუსტი არ არის — მათ იგივე მონაცემები აქვთ და უკეთ იყენებენ.", "ძველ მონაცემებზე „მომგებიანი“ სტრატეგიების უმეტესობა ახალ წლებზე იშლება — ეს გადასწავლაა.", "ორი ნიმუში (ფრე თანაბარში, მასპინძელი ანდერდოგი) ორივე პერიოდში პლიუსშია, მაგრამ დიაპაზონში ნულიც შედის — ვაკვირდებით.", "xG-ის დამატებამ (2023–26, 1240 მატჩი) მოდელი ყველა სეზონში გააუმჯობესა: log loss 0.9846 → 0.9802, სიზუსტე 52.7% → 53.3%, 2.5 გოლზე 0.682 → 0.676. ბუკმეიკერთან სხვაობა 1X2-ზე ~28%-ით, 2.5 გოლზე ~70%-ით შემცირდა — ახლა მოდელი xG-ს იყენებს.", "მოწინააღმდეგეების „შეჯახების“ ფაქტორები გავტესტეთ (2023–26, 1237 მატჩი): დარტყმების რაოდენობა (ჩვენი × მათი დაშვებული) — აუმჯობესებს (0.9817 → 0.9783) და მოდელში ჩავამატეთ; კუთხურები — ოდნავ; ფოლები × სტანდარტები, დასრულების „ოსტატობა“, დასვენების დღეები — არა.", "შემადგენლობის ტესტი (2023–26, 1130 მატჩი): რამდენი რეგულარი აკლია (ბოლო 5 მატჩის მიხედვით) და რამდენი „ფასი“ აკლია ძირითად 11-ს — მოდელს კიდევ აუმჯობესებს (0.9751 → 0.9714). ბუკმეიკერთან სხვაობა ~60%-ით შემცირდა (0.0119 → 0.0047).", "სქემების „დაჯახება“ (80 470 მატჩი): სარკისებური სქემები (3-5-2 vs 3-5-2, 4-1-4-1 vs 4-1-4-1) ~0.1 გოლით ნაკლებს იძლევა, განსხვავებული (4-2-3-1 vs 4-3-1-2, 4-4-2 vs 5-4-1) — ~0.1-ით მეტს. ეფექტი მეორდება (კორელაცია 0.57) — ჩართულია, როცა შემადგენლობები ცნობილია.", "ყველაზე რეალისტური გზა: ზუსტი ბაზრის (Pinnacle/Betfair) შედარება სხვა ბუკმეიკერებთან რეალურ დროში — სჭირდება კოეფიციენტების API."], "en": ["No statistical model is more accurate than the bookmaker — they have the same data and use it better.", "Most strategies that 'win' on old data fall apart on new seasons — that is overfitting.", "Two patterns (draws in even games, home underdogs) are positive in both periods but their ranges include zero — on watch.", "Adding xG (2023–26, 1240 matches) improved the model in every season: log loss 0.9846 → 0.9802, accuracy 52.7% → 53.3%, over/under 2.5 0.682 → 0.676. The gap to the bookmaker shrank ~28% on 1X2 and ~70% on goals — the model now uses xG.", "We tested match-up factors (2023–26, 1237 matches): shot volume (ours × theirs conceded) helps (0.9817 → 0.9783) and is now in the model; corners slightly; fouls × set pieces, finishing 'skill' and rest days do not.", "Lineup test (2023–26, 1130 matches): how many regulars are missing (based on the last 5 games) and how much XI value is missing — improves the model further (0.9751 → 0.9714). The gap to the bookmaker shrank ~60% (0.0119 → 0.0047).", "Formation match-ups (80,470 matches): mirror formations (3-5-2 vs 3-5-2, 4-1-4-1 vs 4-1-4-1) give ~0.1 fewer goals, contrasting ones (4-2-3-1 vs 4-3-1-2, 4-4-2 vs 5-4-1) ~0.1 more. The effect repeats (correlation 0.57) — used once lineups are known.", "The most realistic path: compare the sharp market (Pinnacle/Betfair) with other bookmakers in real time — needs an odds API."]}}, "about": "<span class=\"ka\"><b>მოგების შანსები.<\/b> ყოველ გუნდს ვუთვლით, რამდენად ძლიერად უტევს და იცავს — ბოლო 5 სეზონის მატჩებით, ახალ მატჩებს მეტი მნიშვნელობა აქვს. აქედან გამოგვყავს, რამდენ გოლს გაიტანს თითოეული და რა შანსი აქვს მოგებას, ფრეს ან წაგებას. მერე ვამატებთ ახალ ამბებს: ტრავმები და ვინ არ თამაშობს. მონაცემები: football-data.co.uk (2000 წლიდან).<br><br><b>ყვითლები და კუთხურები.<\/b> ვითვლით, რამდენ ყვითელს იღებს ორივე გუნდი და რამდენს აღებინებს მოწინააღმდეგეს, რამდენ კუთხურს იღებს და უშვებს. ვამატებთ მსაჯს (რამდენად მკაცრია) და მატჩის მნიშვნელობას (დერბი, დიდი მატჩი). ფეხბურთელისთვის — რამდენად ხშირად იღებს ყვითელს და რამდენ წუთს თამაშობს.<br><br><b>ნაკრებები.<\/b> FIFA-ს რეიტინგი, გუნდის ღირებულება, ფორმა და ამბები. ჯგუფების საბოლოო ადგილები 20 000-ჯერ „ვითამაშეთ“.<br><br><b>რამდენად ვცდებით?<\/b> ყველა წინასწარმეტყველებას ვამოწმებთ შედეგით — იხ. „სიზუსტე“. ეს სტატისტიკაა და არა გარანტია.<\/span><span class=\"en\"><b>Win chances.<\/b  const first=L.findIndex(x=>x[0]===m.score[0]&&x[1]===m.score[1]);if(first>0)L.unshift(L.splice(first,1)[0]);return L.slice(0,n)}
function panes(m){const P=[];const p=m.p;
 let main=`<div class="kv"><div>${T("სავარაუდო ანგარიში","Likely score")}<b>${sc(m)}</b></div>
  <div>${T("მოსალოდნელი გოლები","Expected goals")}<b>${p.xh.toFixed(1)} – ${p.xa.toFixed(1)}</b></div>
  <div>${T("2.5-ზე მეტი","Over 2.5")}<b>${pct(p.O)}</b></div>
  ${m.odds?`<div>${T("კოეფ. 1 · X · 2","Odds 1 · X · 2")}<b>${m.odds.map(x=>x.toFixed(2)).join("  ")}</b></div>`:""}
  ${m.natl?`<div>${T("რეიტინგი","Rating")}<b>${m.rh} – ${m.ra}</b></div>`:""}
  ${!m.natl&&p.xh!=null?`<div>${T("ყველაზე სავარაუდო ანგარიშები","Most likely scores")}<b>${topScores(m,3).map(x=>`${x[0]}:${x[1]} <span class="muted" style="font-weight:400;font-size:.8em">${Math.round(x[2]*100)}%</span>`).join(" · ")}</b></div>`:""}
  ${subGoal(m)!=null?`<div>${T("სათადარიგო გაიტანს","A sub scores")}<b>${pct(subGoal(m))}</b></div>`:""}</div>`;
 if(subGoal(m)!=null)main+=how(`რამდენ მატჩში გაიტანა გოლი ცვლილებით შესულმა მოთამაშემ (ნებისმიერი გუნდიდან): 2020 წლიდან (5 ცვლილება) ბუნდესლიგაში ~38%, ლა ლიგაში ~37%, ლიგა 1-ში ~36%, სერია A-ში ~35%, პრემიერლიგაში ~32%. გოლიან მატჩში შანსი ოდნავ მეტია. სამართლიანი კოეფიციენტი = 1 ÷ შანსი: ${(1/subGoal(m)).toFixed(2)}. ტესტი 2024–26: ლიგის საშუალოზე მხოლოდ ოდნავ უკეთესია — მატჩებს შორის სხვაობა მცირეა.`,`How often a substitute (either team) scored: since 2020 (5 subs) Bundesliga ~38%, LaLiga ~37%, Ligue 1 ~36%, Serie A ~35%, Premier League ~32%. A bit higher in high-scoring games. Fair odds = 1 ÷ chance: ${(1/subGoal(m)).toFixed(2)}. Tested 2024–26: only slightly better than the league average — matches differ little.`);
 main+=mvBlock(m);
 if(m.why) main+=`<ul class="why">${m.why.ka.map((k,i)=>`<li>${T(esc(k),esc(m.why.en[i]))}</li>`).join("")}</ul>`;
 if(false) main+=`<div class="refb">💎 ${m.bets.map(b=>`${T(esc(b.ka),esc(b.en))} @ <b>${b.odds.toFixed(2)}</b> <span class="pos">+${(b.edge*100).toFixed(1)}%</span>`).join("<br>")}</div>`;
 const tags=(m.tags||[]).map(t=>`<span class="tag ${t[0]}">${t[1]}</span>`).join(""); if(tags) main+=`<div style="margin-top:10px">${tags}</div>`;
 P.push([T("მთავარი","Summary"),main]);
 let cd="";if(m.cards)cd+=cardsBlock(m.cards);if(m.booked&&(m.booked.h.length||m.booked.a.length))cd+=bookedBlock(m);if(m.ref!==undefined)cd+=refBlock(m.ref);
 if(cd)P.push([T("ბარათები და მსაჯი","Cards & referee"),cd]);
 if(m.clash&&m.clash.length)P.push([T("სტილი","Styles"),clashBlock(m)]);
 if(m.form_h||m.h2h)P.push([T("ფორმა","Form"),`<div class="grid g2 mini"><div><h4>${T("ბოლო 5 მატჩი","Last 5 matches")}</h4>
  <div style="margin:4px 0">${form(m.form_h)} <span class="muted">${nm(m.home)}</span></div><div>${form(m.form_a)} <span class="muted">${nm(m.away)}</span></div></div>
  <div><h4>${T("ურთიერთშეხვედრები","Head to head")}</h4><ul>${(m.h2h||[]).map(x=>`<li>${esc(x)}</li>`).join("")||`<li>${T("არ შეხვედრიან","No meetings")}</li>`}</ul></div></div>`]);
 if(m.natl)P.push([T("რეიტინგი და ამბები","Rating & news"),natlInfo(m)]);
 else if(m.news_teams&&m.news_teams.length){const d=(x,y)=>{const v=Math.round((x-y)*100);return v===0?"0":(v>0?"+":"")+v};
  P.push([T("ამბები","News"),`<div class="refb">${T("ამბების გავლენა პროცენტებზე","Effect of team news")}: ${nm(m.home)} <b>${d(m.p.H,m.p0.H)}</b> · ${T("ფრე","Draw")} <b>${d(m.p.D,m.p0.D)}</b> · ${nm(m.away)} <b>${d(m.p.A,m.p0.A)}</b></div><div class="grid g2">${m.news_teams.map(t=>newsCard(t,false,DATA.epl.news)).join("")}</div>`])}
 return `<div class="tabs" role="tablist">${P.map((x,i)=>`<button role="tab" class="${i?"":"on"}" data-p="${i}">${x[0]}</button>`).join("")}</div>${P.map((x,i)=>`<div class="pane${i?"":" on"}">${x[1]}</div>`).join("")}`}
const BYID={};

const ICON={out:"❌",doubt:"⚠️",in:"✅",info:"ℹ️"};
function newsCard(t,full,src){const N=(src||DATA.natl.news)[t];if(!N)return "";
 let h=`<div class="refb"><b>${badge(t)} ${nm(t)}</b><ul style="margin:6px 0 0;padding-left:18px">${(N.items||[]).map(i=>`<li>${ICON[i.type]||"•"} ${T(esc(i.ka),esc(i.en))}</li>`).join("")}</ul>`;
 if(N.mood&&full) h+=`<div style="margin-top:8px"><b class="small">${T("💬 ბანაკიდან / განწყობა","💬 From the camp / mood")}</b><ul style="margin:4px 0 0;padding-left:18px">${N.mood.ka.map((k,i)=>`<li>${T(esc(k),esc(N.mood.en[i]))}</li>`).join("")}</ul></div>`;
 if(N.sources) h+=`<div class="small muted" style="margin-top:6px">${T("წყაროები","Sources")}: ${N.sources.map(x=>`<a href="${esc(x[1])}" target="_blank" rel="noopener">${esc(x[0])}</a>`).join(" · ")}</div>`;

function compRow(t,r){const c=DATA.natl.comp[t];if(!c)return "";const sg=v=>(v>0?"+":"")+Math.round(v);
 return `<tr><td><div class="tm">${badge(t)}<span>${nm(t)}</span></div></td><td class="n">${Math.round(c.fifa)}</td><td class="n">${c.value?("€"+(c.value>=1000?(c.value/1000).toFixed(2)+"bn":Math.round(c.value)+"m")):"–"}${c.value_out?` <span class="neg small">−€${c.value_out}m</span>`:""}</td><td class="n">${sg(c.form)}</td><td class="n">${sg(r-c.base-c.form)}</td><td class="n"><b>${r}</b></td></tr>`}
function natlInfo(m){

function bookedBlock(m){
 const PK={DEF:T("მცველი","DEF"),MID:T("ნახ.","MID"),FWD:T("თავდ.","FWD"),GK:T("მეკარე","GK")};
 const col=(team,arr)=>`<div style="flex:1;min-width:220px"><div class="muted small" style="margin-bottom:4px"><b>${nm(team)}</b></div>`+arr.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid rgba(128,128,128,.15)"><span>${plLink(x.pk,x.name)} <span class="muted small">${PK[x.pos]||""} · ~${x.min}'${x.gs?` · ${x.ys}🟨 ${x.gs} ${T("მატჩში","games")}`:""}</span>${x.pavg&&x.rate90/x.pavg>=1.5?` <span class="tag g">${(x.rate90/x.pavg).toFixed(1)}× ${T("საშ.","avg")}</span>`:""}${x.args?` <span class="tag">🗣️ ${x.args}</span>`:""}${x.warn?` <span class="tag">⚠️ ${T("დისკვალ. ზღვარზე","1 from ban")}</span>`:""}</span><b>${Math.round(x.p*100)}%</b></div>`).join("")+`</div>`;
 return `<div class="card box small" style="margin-top:10px">🟨 <b>${T("ვინ მიიღებს ყვითელს","Who gets booked")}</b><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px">${col(m.home,m.booked.h)}${col(m.away,m.booked.a)}</div><details class="how"><summary>${T("როგორ ვითვლით","How we calculate")}</summary><div>${T("მოთამაშის ყვითლები 90 წუთზე (ბოლო სეზონები, ახალს მეტი წონა, პოზიციის საშუალოსკენ შემცირებული) × მოსალოდნელი წუთები (ბოლო 5 მატჩი). ტესტი EPL 2021–26: უფრო ზუსტია, ვიდრე მხოლოდ პოზიცია. ⚠️ — მოთამაშეს შემდეგი ყვითელი დისკვალიფიკაციას მოუტანს: ასეთები ~25%-ით ნაკლებად იღებენ ყვითელს (ფრთხილობენ, EPL 2019–26), ამიტომ შანსს ვამცირებთ. ტრავმები და შემადგენლობა არ ითვლება — მატჩის დღეს გადაამოწმე.","⚠️ — one yellow from a ban: such players get booked ~25% less (EPL 2019–26), so we lower the chance. Player's yellows per 90 (recent seasons weighted, shrunk to position average) × expected minutes (last 5). Tested EPL 2021–26. Injuries and lineups not included — check on match day.")}</div></details></div>`}
function clashBlock(m){
 const rk=(r,n)=>`<span class="muted">#${r}</span>`;
 const tg=t=>t==="hi"?` <span class="pos">🔥 ${T("ორივე ტოპ-5","both top-5")}</span>`:t==="lo"?` <span class="muted">❄️ ${T("ორივე ბოლო-5","both bottom-5")}</span>`:"";
 let rows="";
 for(const s of m.clash){
  s.rows.forEach((r,i)=>{const me=r.side==="h"?m.home:m.away, op=r.side==="h"?m.away:m.home;
   rows+=`<tr>${i===0?`<td rowspan="2"><b>${T(s.ka,s.en)}</b><br><span class="muted small">${T("ლიგის საშ.","league avg")} ${s.avg.toFixed(1)} · ${T("ჯამი","total")} <b>${s.total.toFixed(1)}</b></span></td>`:""}<td>${nm(me)} <span class="muted small">${T(s.vf,"")}</span> ${r.for.toFixed(1)} ${rk(r.for_rank)}</td><td>${nm(op)} <span class="muted small">${T(s.va,"allows")}</span> ${r.opp_against.toFixed(1)} ${rk(r.opp_rank)}</td><td class="n"><b>${r.exp.toFixed(1)}</b>${tg(r.tag)}</td></tr>`});
 }
 return `<div class="card box small" style="margin-top:10px">⚔️ <b>${T("სტილების შეჯახება","Style matchup")}</b><div class="tw" style="margin-top:6px"><table><thead><tr><th></th><th>${T("გუნდი თვითონ (ადგილი ლიგაში)","Team itself (league rank)")}</th><th>${T("მოწინააღმდეგე უშვებს (ადგილი)","Opponent allows (rank)")}</th><th class="n">${T("მოსალოდნელი","Expected")}</th></tr></thead><tbody>${rows}</tbody></table></div><details class="how"><summary>${T("როგორ ვითვლით","How we calculate")}</summary><div>${T("#1 = ლიგაში ყველაზე მეტი. გათვლა: გუნდის მაჩვენებელი და მოწინააღმდეგის დათმობა, ლიგის საშუალოსკენ შემცირებული (ტესტი 257 ათას მატჩზე: გუნდების უკიდურესი მაჩვენებლები ნაწილობრივ შემთხვევითია, ამიტომ სუფთა გამრავლება აზვიადებს). დამატებითი „შეჯახების“ ეფექტი არ ჩანს.","#1 = most in the league. Team rate and opponent's allowed rate, shrunk toward the league average (tested on 257k matches: extreme team rates are partly noise, so plain multiplication overstates). No extra clash effect.")}</div></details></div>`}
function cardsBlock(c){

 return `<div class="card box small" style="margin-top:10px">🟨 <b>${T("მოსალოდნელი ყვითელი ბარათები","Expected yellow cards")}: ${c.exp.toFixed(1)}</b> · ${T("3.5-ზე მეტი","Over 3.5")} ${pct(c.o35)} · ${T("4.5-ზე მეტი","Over 4.5")} ${pct(c.o45)}${c.ref_factor!==1?` · ${T("მსაჯის ფაქტორი","Referee factor")} ×${c.ref_factor.toFixed(2)}`:""}${dz?`<br>${dz}`:""}<details class="how"><summary>${T("როგორ ვითვლით","How we calculate")}</summary><div>${T("გუნდების ბარათიანობა + მსაჯი + დერბი (ტესტი: 60 496 მატჩი). ","Teams' card rates + referee + derby (tested on 60,496 matches). ")}</div></details></div>`}
function refBlock(r){
 if(!r) return `<div class="refb">⚖️ ${T("მსაჯი ჯერ არ დასახელებულა — ჩვეულებრივ მატჩამდე 1–2 დღით ადრე ჩნდება","Referee not announced yet — usually 1–2 days before the match")}</div>`;
 let h=`<div class="refb">⚖️ ${T("მსაჯი","Referee")}: <b>${esc(r.ref)}</b>`;
 if(r.ypg!=null&&r.n){const x=r.ypg/r.avg,tag=x>=1.1?T(" — მკაცრი"," — strict"):x<=0.9?T(" — რბილი"," — lenient"):T(" — საშუალო"," — average");
  h+=`${tag}${r.rank?`<div class="small" style="margin-top:4px">${T(`ლიგის ${r.of} მსაჯიდან <b>${r.rank}-ე</b> ყველაზე მკაცრი`,`<b>#${r.rank}</b> strictest of ${r.of} referees in the league`)}</div><div class="rsc" aria-hidden="true"><i style="left:${((r.avg-r.min)/(r.max-r.min)*100).toFixed(0)}%"></i><b style="left:${((r.ypg-r.min)/(r.max-r.min)*100).toFixed(0)}%"></b></div><div class="muted small" style="display:flex;justify-content:space-between;max-width:340px"><span>${T("რბილი","lenient")} ${r.min.toFixed(1)}</span><span>${T("მკაცრი","strict")} ${r.max.toFixed(1)}</span></div>`:""}<div class="small" style="margin-top:4px">${T(`ბოლო 3 სეზონში ${r.n} მატჩი, საშუალოდ <b>${r.ypg.toFixed(1)}</b> ყვითელი მატჩში (ლიგის საშუალო ${r.avg.toFixed(1)})`,`${r.n} matches in the last 3 seasons, <b>${r.ypg.toFixed(1)}</b> yellows per match (league average ${r.avg.toFixed(1)})`)}</div>`}
 else if(r.n) h+=` <span class="muted small">· ${T(`${r.n} მატჩი`,`${r.n} matches`)}</span>`;
 const tl=(r.teams||[]).filter(t=>t.n);
 if(tl.length) h+=`<ul style="margin:6px 0 0;padding-left:18px">${tl.map(t=>`<li><b>${nm(t.team)}</b>: ${T(`ამ მსაჯთან ${t.n} მატჩი`,`${t.n} matches with this referee`)}${t.w!=null?T(` — ${t.w} მოგება, ${t.d} ფრე, ${t.l} წაგება`,` — W${t.w} D${t.d} L${t.l}`):""} · 🟨 ${t.yellows}${t.reds?` · 🟥 ${t.reds}`:""}</li>`).join("")}</ul>`;
 return h+"</div>"}

 if(x.warn)h+=`<div class="honest" style="margin:0 0 10px">⚠️ ${T(`<b>${x.y} ყვითელი</b> — შემდეგი ყვითელი დისკვალიფიკაციას ნიშნავს. ასეთი მოთამაშეები ჩვეულებრივ ფრთხილობენ: ყვითელს ~25%-ით ნაკლებად იღებენ.`,`<b>${x.y} yellows</b> — one more means a ban. Players in this spot are usually careful: booked ~25% less often.`)}</div>`;
 h+=`<div class="pst"><div><b>${x.apps}</b><span>${T("მატჩი","games")}</span></div><div><b>${x.mins}</b><span>${T("წუთი","minutes")}</span></div><div><b>${x.g}+${x.a}</b><span>${T("გოლი+საგოლე","goals+assists")}</span></div>
 <div><b>${x.y}${x.r?` <span style="color:var(--bad)">+${x.r}🟥</span>`:""}</b><span>🟨 ${T("ყვითელი","yellows")}</span></div><div><b>${p90(x.f)}</b><span>${T("ფოლი 90 წუთში","fouls per 90")}</span></div><div><b>${p90(x.sh)}</b><span>${T("დარტყმა 90 წუთში","shots per 90")}</span></div></div>`;
 const nx=plNextInfo(k);if(nx)h+=`<p class="small" style="margin:6px 0 12px">${nx}</p>`;
 if(x.last?.length)h+=`<h3 style="font-size:15px;margin:8px 0 6px">${T("ბოლო მატჩები","Last matches")}</h3><div class="tw"><table><thead><tr><th>${T("თარიღი","Date")}</th><th>${T("მეტოქე","Opponent")}</th><th class="n">${T("ანგ.","Score")}</th><th class="n">${T("წთ","Min")}</th><th class="n">⚽</th><th class="n">🅰️</th><th class="n">🟨</th></tr></thead><tbody>
 ${x.last.slice().reverse().map(r=>`<tr><td class="muted" style="white-space:nowrap">${dshort(r[0])}</td><td>${r[2]?"":"@ "}${nm(r[1])}</td><td class="n">${esc(r[3])}</td><td class="n">${r[4]}'</td><td class="n">${r[6]||""}</td><td class="n">${r[7]||""}</td><td class="n">${r[5]?"🟨".repeat(r[5]):""}</td></tr>`).join("")}</tbody></table></div>`;
 return h+`<p class="muted small" style="margin:10px 0 0">${T("ამ სეზონის ლიგის მატჩები (ESPN). „@“ — გასვლაზე.","This season's league games (ESPN). “@” = away.")}</p>`}
function openPl(k){if(!PL[k])return;let o=document.getElementById("plm");if(!o){o=document.createElement("div");o.id="plm";o.className="ovl";document.body.appendChild(o)}

 h+=`<div class="tp" data-t="ban" style="display:none"><h2>${T("ერთი ყვითელი დისკვალიფიკაციამდე","One yellow from a ban")}</h2><p class="sub">${T("თუ შემდეგ მატჩში ყვითელს მიიღებენ, მომდევნოს გამოტოვებენ. ჩვენი ტესტით ასეთი მოთამაშეები ~25%-ით ნაკლებად იღებენ ყვითელს — ფრთხილობენ.","If they're booked in the next game, they miss the one after. Our test: such players get booked ~25% less — they play carefully.")}</p>`;
 const by={};BN.forEach(b=>(by[PL[b.pk].div]=by[PL[b.pk].div]||[]).push(b));
 const ord=["E0","SP1","I1","D1","F1"].filter(d=>by[d]);
 h+=ord.length?ord.map(d=>`<h3>${LGN(d)} <span class="muted small" style="font-weight:400">— ${T(...BANRULE[d])}</span></h3><div class="card tw"><table><thead><tr><th>${T("მოთამაშე","Player")}</th><th>${T("გუნდი","Team")}</th><th class="n">🟨</th><th>${T("შემდეგი მატჩი","Next match")}</th></tr></thead><tbody>
  ${by[d].map(b=>{const x=PL[b.pk];return `<tr><td>${plLink(b.pk,x.name)}</td><td>${nm(x.team)}</td><td class="n">${x.y}</td><td class="small">${b.date?`${dshort(b.date)} — ${nm(b.opp)}`:"—"}</td></tr>`}).join("")}</tbody></table></div>`).join(""):`<div class="card box note">${T("ახლა არავინ არის დისკვალიფიკაციის ზღვარზე.","Nobody is one yellow from a ban right now.")}</div>`;
 h+=how("ყვითლებს ვითვლით ამ სეზონის ლიგის მატჩებიდან (ESPN). თითო ლიგას თავისი წესი აქვს. საფრანგეთში დისკვალიფიკაცია 3 ყვითელზე 10 მატჩის განმავლობაში ითვლება — ეს ჯერ არ შეგვყავს. სიაში არ არიან ისინი, ვისაც 3 კვირაზე მეტია არ უთამაშია.","Yellows are counted from this season's league games (ESPN). Each league has its own rule. France uses 3 yellows within 10 games — not modelled yet. Players who haven't played for 3+ weeks are left out.")+`</div>`;
 if(DATA.coaches)h+=`<div class="tp" data-t="coach" style="display:none">${coachBlock()}</div>`;

function coachBlock(){const C=DATA.coaches,yr=C.data_to.slice(0,4);
 const card=(c,rk,good)=>{const d=Math.round((c.score-1)*100);return `<div class="card gp"><div style="display:flex;gap:14px;align-items:center"><div style="font-family:var(--num);font-size:30px;font-weight:700;color:${good?"var(--amb)":"var(--muted)"};min-width:26px">${rk}</div>
  <div><b>${esc(c.name)}</b> <span class="muted small">${esc(c.club)} · ${LGN(c.div)}</span>
  <div class="small" style="margin-top:4px">${T(`შეყვანილმა მოთამაშეებმა ${c.n} მატჩში <b>${c.ga}</b> გოლი+საგოლე გააკეთეს — მოსალოდნელზე <b>${d>0?"+":""}${d}%</b>`,`His substitutes made <b>${c.ga}</b> goals+assists in ${c.n} games — <b>${d>0?"+":""}${d}%</b> vs expected`)}</div>
  <div class="muted small" style="margin-top:3px">${T(`პირველ ცვლილებას ჩვეულებრივ ${c.first}-ე წუთზე აკეთებს`,`Usually makes his first change in minute ${c.first}`)}${c.star?T(` · ყველაზე ხშირად სათადარიგოდან გაიტანა: <b>${esc(c.star[0])}</b> (${c.star[1]})`,` · Top super-sub: <b>${esc(c.star[0])}</b> (${c.star[1]})`):""}</div></div></div></div>`};
 return `<h2>${T("ვისი ცვლილებები „ამუშავებს“","Whose substitutions work")}</h2><p class="sub">${T(`ტოპ-5 ლიგის ${C.n} მწვრთნელი (150+ მატჩი, 2025/26-ში ტოპ-ლიგაში წვრთნიდა). ${C.games.toLocaleString("en")} მატჩი, ${yr} წლის მაისამდე.`,`${C.n} coaches from the top 5 leagues (150+ games). ${C.games.toLocaleString("en")} matches up to May ${yr}.`)}</p>
 ${C.top.map((c,i)=>card(c,i+1,true)).join("")}
 <h3>${T("ყველაზე ნაკლებად","At the other end")}</h3>${C.bottom.map((c,i)=>card(c,C.n-i,false)).join("")}
 <div class="honest"><b>${T("პატიოსნად","Honestly")}</b> ${T("შევამოწმეთ, არის თუ არა ეს უნარი: მწვრთნელების მატჩები ორად გავყავით (კენტი და ლუწი სეზონები). ვინც ერთ ნახევარში კარგად ცვლიდა, მეორეში მხოლოდ ოდნავ უკეთესი იყო საშუალოზე (კავშირი 0.09). ანუ ეს ძირითადად წარსულის შედეგია და იღბალიც ბევრს წყვეტს — პროგნოზად ნუ გამოიყენებ.","We checked whether this is a skill: we split each coach's games in two (odd and even seasons). Coaches who did well in one half were only slightly better than average in the other (correlation 0.09). So this is mostly past results with plenty of luck — don't use it as a prediction.")}</div>
 ${how("მოსალოდნელი = შეყვანილი მოთამაშის წუთები × რამდენი გოლი გადის ჩვეულებრივ ამ წუთებში × გუნდის ძალა (რამდენს იტანს სეზონში). ლიგებს შორის განსხვავებაც გათვალისწინებულია (მაგ. ბუნდესლიგაში სათადარიგოები ბევრად მეტს იტანენ). გუნდი — ბოლო, რომელსაც 2025/26 სეზონში წვრთნიდა. მონაცემები: Transfermarkt.","Expected = the sub's minutes × how many goals usually come in those minutes × team strength (season goals). League differences are adjusted for (e.g. Bundesliga subs score far more). Team = the last one he coached in 2025/26. Data: Transfermarkt.")}`}
function trackBlock(){const R=DATA.track;
 let h=`<h2>${T("როგორ გავიდა ჩვენი გათვლები","How our predictions went")}</h2>`;
 if(!R||!R.n)return h+`<div class="card box note">${T("ყველა გათვლას ვინახავთ მატჩის დაწყებამდე და მერე ნამდვილ შედეგს ვადარებთ — არაფერს ვმალავთ. ჩაწერა 16 ნოემბერს დავიწყეთ, პირველი შედეგები შემდეგი ტურის მერე გამოჩნდება.","We save every prediction before kick-off and compare it with what really happened — nothing hidden. We started on 16 November; the first results appear after the next round.")}</div>`;

 <div class="grid g4">${tile(T("ფავორიტმა (50%+) მოიგო","Favourite (50%+) won"),fr(R.fav),fp(R.fav))}${tile(T("2.5 გოლი: სწორი მხარე","Over/under 2.5 right"),fr(R.ou),fp(R.ou))}
 ${R.y.n?tile(T("ყვითლები: ველოდით → იყო","Yellows: expected → real"),`${Math.round(R.y.exp)}→${R.y.real}`,T(`საშ. ცდომილება მატჩში ±${R.y.mae}`,`avg miss ±${R.y.mae} per match`)):""}
 ${R.pl.hi_n?tile(T("25%+ შანსიანმა მიიღო ყვითელი","25%+ picks booked"),`${R.pl.hi_hit}/${R.pl.hi_n}`,T(`ველოდით ~${Math.round(R.pl.hi_exp)}-ს`,`we expected ~${Math.round(R.pl.hi_exp)}`)):""}</div>`;
 if(R.k&&R.k.n)h+=`<p class="small muted" style="margin:8px 0 0">🚩 ${T(`კუთხურები: ველოდით ${Math.round(R.k.exp)}, იყო ${R.k.real} (საშ. ცდომილება ±${R.k.mae} მატჩში)`,`Corners: expected ${Math.round(R.k.exp)}, real ${R.k.real} (avg miss ±${R.k.mae})`)}</p>`;
 const PK={H:"1",D:"X",A:"2"};
 h+=`<h3>${T("ბოლო მატჩები","Latest matches")}</h3><div class="card tw"><table><thead><tr><th>${T("მატჩი","Match")}</th><th>${T("შედეგი","Result")}</th><th>2.5</th><th class="n">🟨</th><th>${T("მოთამაშეები","Players")}</th></tr></thead><tbody>
 ${R.rows.slice(0,30).map(r=>`<tr><td><span class="muted small">${dshort(r.date)}</span> ${nm(r.home)} <b>${r.hs}:${r.as}</b> ${nm(r.away)}</td>
  <td style="white-space:nowrap">${r.pick?`${PK[r.pick]} ${pct(r.pp)} <span class="${r.ok?"ok":"no"}">${r.ok?"✓":"✗"}</span>`:""}</td>
  <td style="white-space:nowrap">${r.o!=null?`${r.o>.5?T("მეტი","over"):T("ნაკლ.","under")} <span class="${r.o_ok?"ok":"no"}">${r.o_ok?"✓":"✗"}</span>`:"<span class=muted>—</span>"}</td>
  <td class="n" style="white-space:nowrap">${r.ye!=null?`${r.ye.toFixed(1)}→<b>${r.y}</b>`:""}</td>
  <td class="small">${(r.bk||[]).map(b=>`${esc(b[0])} ${pct(b[1])} <span class="${b[2]?"ok":"no"}">${b[2]?"✓":"✗"}</span>`).join("<br>")}</td></tr>`).join("")}</tbody></table></div>`;
 return h+how("„ფავორიტმა მოიგო“ — მატჩები, სადაც ერთ-ერთ გუნდს 50%+ ვაძლევდით. 2.5 გოლი ითვლება მხოლოდ მაშინ, როცა დარწმუნებული ვიყავით (60%+ ერთ მხარეს). მოთამაშეები: 25%+ შანსიანი მოთამაშე ყოველ 4-დან დაახლოებით 1-ჯერ უნდა „ხვდებოდეს“ — თუ ჩვენი ციფრები სწორია, ✓-ების რაოდენობა ახლოს უნდა იყოს „ველოდით“-თან.","“Favourite won” = matches where we gave a team 50%+. Over/under counts only when we leaned 60%+ one way. Players: a 25% pick should hit about 1 time in 4 — if our numbers are right, the ✓ count should be close to “expected”.")}

/* prefs */
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const B=document.body;if(get("lang")==="en")B.classList.add("en");if(get("theme")==="light")B.classList.add("light");
function lbl(){$("#lang").textContent=B.classList.contains("en")?"KA":"EN";$("#theme").textContent=B.classList.contains("light")?"☾":"☀︎"}lbl();
$("#lang").onclick=()=>{B.classList.toggle("en");set("lang",B.classList.contains("en")?"en":"ka");lbl()};
$("#theme").onclick=()=>{B.classList.toggle("light");set("theme",B.classList.contains("light")?"light":"dark");lbl()};
const OLD={geo:"matches",epl:"matches",value:"matches",prices:"matches",acc:"record",season:"tables",lab:"record",astro:"more",about:"more"};
function show(){let id=(location.hash||"#matches").slice(1);id=OLD[id]||id;if(!document.getElementById("s-"+id))id="matches";
 document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="s-"+id));document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===id));}
addEventListener("hashchange",()=>{show();scrollTo(0,0)});show();
